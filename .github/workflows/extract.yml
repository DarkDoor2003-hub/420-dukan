name: Extract project zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and commit project files
        shell: bash
        run: |
          if [ -f "420-dukan-vercel.zip" ]; then
            unzip -o "420-dukan-vercel.zip"
            rm -f "420-dukan-vercel.zip"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Extract 420 DUKAN project files" || echo "Nothing to commit"
            git push
          else
            echo "Zip not present; nothing to do."
          fi
